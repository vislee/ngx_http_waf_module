# ngx_http_waf_module -- default ruleset (CRS-aligned)
#
# Aligned with OWASP Core Rule Set v3.3 PL1 anomaly-scoring semantics:
# each rule scores a tagged counter, and security_check thresholds turn
# the score into an action. Rule IDs mirror the CRS family the class
# corresponds to:
#
#   920xxx protocol (CRLF injection)      942xxx SQLi (libinjection)
#   941xxx XSS  (libinjection)            930xxx LFI / path traversal
#   932xxx RCE / shell / code exec        934xxx SSRF
#   913xxx recon / scanners               923xxx open redirect
#   919xxx SSTI   918xxx NoSQLi   917xxx LDAPi
#   916xxx deserialization        911xxx code injection
#
# This file contains ONLY http-level directives. The location-level part
# is application config (see README):
#
#   http {
#       include rules/waf-default.conf;
#       server {
#           location / {
#               security_waf on;
#               security_check $SQLI>4 BLOCK;
#               security_check $XSS>4 BLOCK;
#               security_check $CMD>4 BLOCK;
#               security_check $RCE>4 BLOCK;
#               security_check $LFI>4 BLOCK;
#               security_check $SSRF>4 BLOCK;
#               security_check $SSTI>4 BLOCK;
#               security_check $NOSQL>4 BLOCK;
#               security_check $LDAP>4 BLOCK;
#               security_check $DESER>4 BLOCK;
#               security_check $CRLF>3 BLOCK;
#               security_check $CODE>4 BLOCK;
#               security_check $RECON>4 BLOCK;
#               security_check $REDIRECT>4 BLOCK;
#           }
#       }
#   }
#
# Zone policy "blocking set" -- these tags carry BLOCK actions; any other
# tag is alert-only (logged via security_log, never blocks):
#   $SQLI $XSS $CMD $RCE $LFI $SSRF $SSTI $NOSQL $LDAP $DESER $CRLF $CODE
#   $RECON $RFI $PHP
# $REDIRECT is deliberately NOT in the blocking set: the redirect detector
# flags bare protocol-relative values ("//cdn.example.com/a.js"), which are
# legitimate for webhook/callback parameters, so it stays observability-only.
#
# Zone policy notes (FP-driven, verified with the vendored detector):
# - HEADERS: no SSRF rule -- Host ("localhost") classifies as SSRF and
#   would block every request; no CRLF rule -- nginx already rejects
#   control bytes in header values.
# - BODY: no REDIRECT/RECON -- bodies legitimately contain URLs and
#   file paths (forums, webhooks, docs); no CRLF -- uploaded mail bodies
#   and markup fragments carry "\r\nContent-Type:".
# - URL: libinj-only, alert-only. URL holds the request path as sent, so
#   a path segment that literally reads "/nmap/" would score.
# - Scan targets: whitelist-example (disable per location):
#     security_loc_rule "wl:941100" "z:V_ARGS:html~^allow";

# --- 920: protocol / CRLF injection -----------------------------------------
# ARGS only: nginx already rejects control bytes in header values, so a
# HEADERS target can only ever be reached via encoded payloads -- keep it
# out of BODY too: multipart uploads, mail bodies and markup fragments
# legitimately contain "\r\nContent-Type:" and would 403.
security_rule id:920410 "libinj:all" "s:$CRLF:4" "z:ARGS";

# 913100 is the scanner UA list below, not a libinj rule: scanner UAs are
# RECON-classified by libinj:all, but id:913100 is owned by the exact CRS
# regex (see the 913100 section at the end of this file). Two rules with
# one id makes alert/whitelist by id ambiguous, so HEADERS scanner
# matching lives there only.

# --- 930: LFI / path traversal ----------------------------------------------
security_rule id:930100 "libinj:all" "s:$LFI:5" "z:ARGS|URL";
security_rule id:930101 "libinj:all" "s:$LFI:5" "z:BODY";

# --- 932: shell injection (CMD) ----------------------------------------------
security_rule id:932100 "libinj:all" "s:$CMD:5" "z:ARGS";
security_rule id:932101 "libinj:all" "s:$CMD:5" "z:BODY";

# --- 932: code execution (RCE) -----------------------------------------------
security_rule id:932200 "libinj:all" "s:$RCE:5" "z:ARGS";
security_rule id:932201 "libinj:all" "s:$RCE:5" "z:BODY";

# --- 934: SSRF ---------------------------------------------------------------
# ARGS/BODY only -- never HEADERS (Host false positive, see policy notes)
security_rule id:934100 "libinj:all" "s:$SSRF:5" "z:ARGS";
security_rule id:934101 "libinj:all" "s:$SSRF:5" "z:BODY";

# --- 942: SQLi via libinjection (CRS 942100 scans ARGS + REQUEST_BODY) -------
security_rule id:942100 "libinj:all" "s:$SQLI:5" "z:ARGS";
security_rule id:942101 "libinj:all" "s:$SQLI:5" "z:BODY";
security_rule id:942110 "libinj:all" "s:$SQLI:5" "z:HEADERS";

# --- 941: XSS via libinjection (CRS 941100 scans ARGS + REQUEST_BODY) --------
security_rule id:941100 "libinj:all" "s:$XSS:5" "z:ARGS";
security_rule id:941101 "libinj:all" "s:$XSS:5" "z:BODY";
security_rule id:941110 "libinj:all" "s:$XSS:5" "z:HEADERS";

# --- 919: SSTI ----------------------------------------------------------------
security_rule id:919100 "libinj:all" "s:$SSTI:5" "z:ARGS";
security_rule id:919101 "libinj:all" "s:$SSTI:5" "z:BODY";

# --- 918: NoSQL injection ------------------------------------------------------
security_rule id:918100 "libinj:all" "s:$NOSQL:5" "z:ARGS";
security_rule id:918101 "libinj:all" "s:$NOSQL:5" "z:BODY";
security_rule id:918110 "libinj:all" "s:$NOSQL:5" "z:HEADERS";

# --- 917: LDAP injection -------------------------------------------------------
security_rule id:917100 "libinj:all" "s:$LDAP:5" "z:ARGS";
security_rule id:917101 "libinj:all" "s:$LDAP:5" "z:BODY";

# --- 916: deserialization -------------------------------------------------------
security_rule id:916100 "libinj:all" "s:$DESER:5" "z:ARGS";
security_rule id:916101 "libinj:all" "s:$DESER:5" "z:BODY";

# --- 913: recon / scanners -------------------------------------------------------
# HEADERS covers scanner User-Agents; normal UA/curl/python-requests
# verified non-detecting. The split around URL is deliberate: URL carries
# the request path exactly as sent, so a path that literally starts with
# "/nmap/" or "/masscan/" (dropped tool directories) would score here --
# alert-only (security_log), never in the blocking set below.
security_rule id:913101 "libinj:all" "s:$RECON:5" "z:URL";

# --- 923: open redirect ------------------------------------------------------------
security_rule id:923100 "libinj:all" "s:$REDIRECT:5" "z:ARGS";
security_rule id:923110 "libinj:all" "s:$REDIRECT:5" "z:HEADERS";

# --- 911: code injection --------------------------------------------------------------
security_rule id:911100 "libinj:all" "s:$CODE:5" "z:ARGS";
security_rule id:911101 "libinj:all" "s:$CODE:5" "z:BODY";

# --- evasion: base64 decode chain (ARGS) -----------------------------------------------
# the module feeds raw percent-encoded values into decode chains, so b64
# payloads ending in '=' arrive as '%3D' and fail to decode; chains catch
# the common no-padding case and stay FP-safe (benign prose decodes to
# random bytes that classify clean)
security_rule id:942102 "libinj:decode_base64|all" "s:$SQLI:5" "z:ARGS";
security_rule id:941102 "libinj:decode_base64|all" "s:$XSS:5" "z:ARGS";
security_rule id:918102 "libinj:decode_base64|all" "s:$NOSQL:5" "z:ARGS";

# --- evasion: double URL encoding --------------------------------------------------------
security_rule id:941103 "libinj:decode_url|decode_url|all" "s:$XSS:5" "z:ARGS";
security_rule id:942103 "libinj:decode_url|decode_url|all" "s:$SQLI:5" "z:ARGS";

# --- 913100: CRS scanner User-Agents (CRS scanners-user-agents.data) ---------------
# libinj:all misses some scanner UAs (e.g. "Nmap Scripting Engine"), so the
# CRS PL1 913100 UA list is inlined as a case-insensitive regex.
# CRS matches these entries with @pm (substring), which false-positives on
# long names ("Nexus 7", "python-nmap"); here each entry keeps its
# version-shaped form, and the two bare "mozilla" entries are combined
# into one exact Mozilla/<major> match so a normal "Mozilla/5.0 ..." UA
# cannot trip it.
# Target only the User-Agent header value; benign UA strings
# (browser/curl/python-requests) verified non-matching.
security_rule id:913100 "str:rx@(?i)(?:arachni|mozilla/(?:6\.0|5\.g)|betabot|bewica-security-scan|bfac|commix|detectify|dirbuster|fimap|fuzz faster|gobuster|havij|hexometer|jbrofuzz|jorgee|libwhisker|masscan|morfeus|mozlila|nessus|netlab360|netsparker|nettacker|nikto|nuclei/|openvas|securityagent|sitelockspider|sqlmap|sysscan|tsunamisecurityscanner|w3af\.org|webbandit|webshag|wfuzz|whatwaf|whatweb|wprecon|wpscan|feroxbuster|l9explore|l9tcpid|wapiti|vega/|appspider|ironwasp|skipfish|qualysguard|n-stalker|acunetix|cmsmap|sqlninja|xsstrike|xsser|joomscan|droopescan|zgrab/|ghauri|zmeu|wpprobe|sstimap|hydra\)|tplmap|dotdotpwn|kadimus|lfimap|lfisuite|panoptic|graphql-cop|jsql|noseyparker|trufflehog|yeswehack-hunter|tinja)" "s:$RECON:5" "z:V_HEADERS:User-Agent";

# --- 931: remote file inclusion (CRS 931100/931110/931120, PL1) ---------------------
security_rule id:931100 "str:decode_url|rx@^(?i:(?:f(?:ile|tps?)|https?|ssh):/{2,3}(?:\[[0-9a-f:]+\]|(?:\d{1,3}\.){3}\d{1,3}|/))" "s:$RFI:5" "z:ARGS";
security_rule id:931110 "str:decode_url|rx@(?i:\binclude[\s]*\([^\)]*|(?:mosConfig_absolute_path|_(?:CONF\[path\]|SERVER\[DOCUMENT_ROOT\])|path\[docroot\]|config\[root_dir\]|GALLERY_BASEDIR|appserv_root)=(?:f(?:ile|tps?)|https?)://)" "s:$RFI:5" "z:ARGS";
security_rule id:931120 "str:decode_url|rx@^(?i:file|ftps?|https?).*?\?+$" "s:$RFI:5" "z:ARGS";

# --- 933: PHP injection (CRS 933100/933120/933160, PL1) ------------------------------
# IDs follow the CRS rule each regex is ported from: 933100 open tag,
# 933120 PHP configuration/function-name invocation (CRS @pmFromFile
# php-variables.data + the 933120 regex), 933160 dangerous function call
# (CRS function list). 933110/933111 in CRS are upload FILENAME rules --
# this module matches values only, so those are not ported under those ids.
security_rule id:933100 "str:decode_url|rx@<\?(?:php[\s]|[\s=]|$)|\[(?:/|\\\\\\\\)?php\]|\{/?php\}" "s:$PHP:5" "z:ARGS";
security_rule id:933120 "str:decode_url|rx@(?i:\b(?:allow_url_(?:fopen|include)|phpinfo|preg_replace\s*/.*\/e|\$\s*\{\s*\S[^\{]))" "s:$PHP:5" "z:ARGS";
security_rule id:933160 "str:decode_url|rx@(?i)\b(?:assert|create_function|eval|exec|system|passthru|shell_exec|popen|proc_open|pcntl_exec|include|include_once|require|require_once|file_get_contents|readfile|fpassthru|php_uname|posix_getpwuid|posix_kill|posix_mkfifo|posix_setpgid|posix_setsid|posix_setuid)\s*\(" "s:$PHP:5" "z:ARGS";


# --- 913111: nmap / Censys client UA, matched by its version-shaped form --------
# The bare token "nmap" cannot be substring-matched: python-nmap (a legitimate
# library UA) contains it. Anchoring on the UA shape keeps the two apart.
# Scores $RECON, so it is covered by the same security_check $RECON>4
# BLOCK line as the rest of the scanner family.
security_rule id:913111 "str:rx@(?i)(?:^|[;(\s])(?:nmap/?|nmap scripting engine|censysinspect(?:/| \())" "s:$RECON:5" "z:V_HEADERS:User-Agent";

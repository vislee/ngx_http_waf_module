# ngx_http_waf_module -- default ruleset (CRS-aligned)
#
# Aligned with OWASP Core Rule Set v3.3 PL1 anomaly-scoring semantics:
# each rule scores a tagged counter, and security_check thresholds turn
# the score into an action. Rule IDs mirror the CRS family the class
# corresponds to:
#
#   920xxx protocol (CRLF injection)      942xxx SQLi (libinjection)
#   941xxx XSS  (libinjection)            930xxx LFI / path traversal
#   932xxx RCE / shell / code exec        934xxx SSRF
#   913xxx recon / scanners               923xxx open redirect
#   919xxx SSTI   918xxx NoSQLi   917xxx LDAPi
#   916xxx deserialization        911xxx code injection
#
# This file contains ONLY http-level directives. The location-level part
# is application config (see README):
#
#   http {
#       include rules/waf-default.conf;
#       server {
#           location / {
#               security_waf on;
#               security_check $SQLI>4 BLOCK;
#               security_check $XSS>4 BLOCK;
#               security_check $CMD>4 BLOCK;
#               security_check $RCE>4 BLOCK;
#               security_check $LFI>4 BLOCK;
#               security_check $SSRF>4 BLOCK;
#               security_check $SSTI>4 BLOCK;
#               security_check $NOSQL>4 BLOCK;
#               security_check $LDAP>4 BLOCK;
#               security_check $DESER>4 BLOCK;
#               security_check $CRLF>3 BLOCK;
#               security_check $CODE>4 BLOCK;
#               security_check $RECON>4 BLOCK;
#               security_check $REDIRECT>4 BLOCK;
#           }
#       }
#   }
#
# Zone policy notes (FP-driven, verified with the vendored detector):
# - HEADERS: no SSRF rule -- Host ("localhost") classifies as SSRF and
#   would block every request; no CRLF rule -- nginx already rejects
#   control bytes in header values.
# - BODY: no REDIRECT/RECON -- bodies legitimately contain URLs and
#   file paths (forums, webhooks, docs).
# - Scan targets: whitelist-example (disable per location):
#     security_loc_rule "wl:941100" "z:V_ARGS:html~^allow";

# --- 920: protocol / CRLF injection -----------------------------------------
security_rule id:920410 "libinj:all" "s:$CRLF:4" "z:ARGS|HEADERS";
security_rule id:920411 "libinj:all" "s:$CRLF:4" "z:BODY";

# --- 930: LFI / path traversal ----------------------------------------------
security_rule id:930100 "libinj:all" "s:$LFI:5" "z:ARGS|URL";
security_rule id:930101 "libinj:all" "s:$LFI:5" "z:BODY";

# --- 932: shell injection (CMD) ----------------------------------------------
security_rule id:932100 "libinj:all" "s:$CMD:5" "z:ARGS";
security_rule id:932101 "libinj:all" "s:$CMD:5" "z:BODY";

# --- 932: code execution (RCE) -----------------------------------------------
security_rule id:932200 "libinj:all" "s:$RCE:5" "z:ARGS";
security_rule id:932201 "libinj:all" "s:$RCE:5" "z:BODY";

# --- 934: SSRF ---------------------------------------------------------------
# ARGS/BODY only -- never HEADERS (Host false positive, see policy notes)
security_rule id:934100 "libinj:all" "s:$SSRF:5" "z:ARGS";
security_rule id:934101 "libinj:all" "s:$SSRF:5" "z:BODY";

# --- 942: SQLi via libinjection (CRS 942100 scans ARGS + REQUEST_BODY) -------
security_rule id:942100 "libinj:all" "s:$SQLI:5" "z:ARGS";
security_rule id:942101 "libinj:all" "s:$SQLI:5" "z:BODY";
security_rule id:942110 "libinj:all" "s:$SQLI:5" "z:HEADERS";

# --- 941: XSS via libinjection (CRS 941100 scans ARGS + REQUEST_BODY) --------
security_rule id:941100 "libinj:all" "s:$XSS:5" "z:ARGS";
security_rule id:941101 "libinj:all" "s:$XSS:5" "z:BODY";
security_rule id:941110 "libinj:all" "s:$XSS:5" "z:HEADERS";

# --- 919: SSTI ----------------------------------------------------------------
security_rule id:919100 "libinj:all" "s:$SSTI:5" "z:ARGS";
security_rule id:919101 "libinj:all" "s:$SSTI:5" "z:BODY";

# --- 918: NoSQL injection ------------------------------------------------------
security_rule id:918100 "libinj:all" "s:$NOSQL:5" "z:ARGS";
security_rule id:918101 "libinj:all" "s:$NOSQL:5" "z:BODY";
security_rule id:918110 "libinj:all" "s:$NOSQL:5" "z:HEADERS";

# --- 917: LDAP injection -------------------------------------------------------
security_rule id:917100 "libinj:all" "s:$LDAP:5" "z:ARGS";
security_rule id:917101 "libinj:all" "s:$LDAP:5" "z:BODY";

# --- 916: deserialization -------------------------------------------------------
security_rule id:916100 "libinj:all" "s:$DESER:5" "z:ARGS";
security_rule id:916101 "libinj:all" "s:$DESER:5" "z:BODY";

# --- 913: recon / scanners -------------------------------------------------------
# HEADERS covers scanner User-Agents (sqlmap/nikto/nessus); normal
# UA/curl/python-requests verified non-detecting
security_rule id:913100 "libinj:all" "s:$RECON:5" "z:HEADERS";
security_rule id:913101 "libinj:all" "s:$RECON:5" "z:ARGS|URL";

# --- 923: open redirect ------------------------------------------------------------
security_rule id:923100 "libinj:all" "s:$REDIRECT:5" "z:ARGS";
security_rule id:923110 "libinj:all" "s:$REDIRECT:5" "z:HEADERS";

# --- 911: code injection --------------------------------------------------------------
security_rule id:911100 "libinj:all" "s:$CODE:5" "z:ARGS";
security_rule id:911101 "libinj:all" "s:$CODE:5" "z:BODY";

# --- evasion: base64 decode chain (ARGS) -----------------------------------------------
# the module feeds raw percent-encoded values into decode chains, so b64
# payloads ending in '=' arrive as '%3D' and fail to decode; chains catch
# the common no-padding case and stay FP-safe (benign prose decodes to
# random bytes that classify clean)
security_rule id:942102 "libinj:decode_base64|all" "s:$SQLI:5" "z:ARGS";
security_rule id:941102 "libinj:decode_base64|all" "s:$XSS:5" "z:ARGS";
security_rule id:918102 "libinj:decode_base64|all" "s:$NOSQL:5" "z:ARGS";

# --- evasion: double URL encoding --------------------------------------------------------
security_rule id:941103 "libinj:decode_url|decode_url|all" "s:$XSS:5" "z:ARGS";
security_rule id:942103 "libinj:decode_url|decode_url|all" "s:$SQLI:5" "z:ARGS";

# --- 913100: CRS scanner User-Agents (CRS scanners-user-agents.data) ---------------
# libinj:all misses some scanner UAs (e.g. "Nmap Scripting Engine"), so the
# CRS PL1 913100 UA list is inlined as a case-insensitive regex.
# Target only the User-Agent header value; benign UA strings
# (browser/curl/python-requests) verified non-matching.
security_rule id:913100 "str:rx@(?i)(?:arachni|mozilla/6\.0|betabot|bewica-security-scan|bfac|commix|detectify|dirbuster|fimap|fuzz faster|gobuster|havij|hexometer|jbrofuzz|jorgee|libwhisker|masscan|morfeus|mozlila|mozilla/5\.g|nessus|netlab360|netsparker|nettacker|nikto|nmap|nuclei|openvas|securityagent|sitelockspider|sqlmap|sysscan|tsunamisecurityscanner|w3af\.org|webbandit|webshag|wfuzz|whatwaf|whatweb|wprecon|wpscan|feroxbuster|l9explore|l9tcpid|wapiti|vega/|appspider|ironwasp|skipfish|qualysguard|n-stalker|acunetix|cmsmap|sqlninja|xsstrike|xsser|joomscan|droopescan|zgrab|ghauri|zmeu|wpprobe|sstimap|hydra\)|tplmap|dotdotpwn|kadimus|lfimap|lfisuite|panoptic|graphql-cop|jsql|noseyparker|trufflehog|yeswehack-hunter|tinja)" "s:$RECON:5" "z:V_HEADERS:User-Agent";

# --- 931: remote file inclusion (CRS 931100/931120, PL1) ----------------------------
security_rule id:931100 "str:decode_url|rx@^(?i:(?:f(?:ile|tps?)|https?|ssh)://(?:\d{1,3}\.){3}\d{1,3})" "s:$RFI:5" "z:ARGS";
security_rule id:931120 "str:decode_url|rx@^(?i:(?:file|ftps?|https?)).*\?+$" "s:$RFI:5" "z:ARGS";

# --- 933: PHP injection (CRS 933100/933110/933111, PL1) ------------------------------
security_rule id:933100 "str:decode_url|rx@<\?(?:php[\s]|[\s=]|$)" "s:$PHP:5" "z:ARGS";
security_rule id:933110 "str:decode_url|rx@\$_(?:GET|POST|COOKIE|SERVER|REQUEST|ENV|FILES|SESSION)" "s:$PHP:5" "z:ARGS";
security_rule id:933111 "str:decode_url|rx@\b(?:phpinfo|eval|exec|system|passthru|shell_exec|popen|proc_open|assert|preg_replace\s*/.*\/e|create_function|include|include_once|require|require_once|file_get_contents|readfile|fpassthru)\s*\(" "s:$PHP:5" "z:ARGS";
